name: repro
on: [push, workflow_dispatch]

# Each cell checks that the copy keeps the cookie. A cell fails where the bug is.
# preview.9 passes. preview.10 and 16.3.0 fail in the proxyconfig and testmode
# cells.
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        next: ["16.3.0-preview.9", "16.3.0-preview.10", "16.3.0"]
    name: "next ${{ matrix.next }}"
    env:
      NEXTV: ${{ matrix.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm add next@${{ matrix.next }}
      - run: pnpm exec playwright install --with-deps chromium

      # testProxy is off. No test-mode runtime. This is the production shape.
      - name: "plain (production shape)"
        if: always()
        env:
          PORT: "3000"
        run: |
          rm -f /tmp/repro.log
          set +e; pnpm e2e:plain; rc=$?; set -e
          echo "===== [REPRO] plain (${{ matrix.next }}) ====="
          cat /tmp/repro.log 2>/dev/null || echo "(no [REPRO] lines)"
          exit $rc

      # testProxy is on. Plain runtime. This separates the config from the runtime.
      - name: "testProxy config, plain runtime"
        if: always()
        env:
          PORT: "3002"
        run: |
          rm -f /tmp/repro.log
          set +e; pnpm e2e:proxyconfig; rc=$?; set -e
          echo "===== [REPRO] proxyconfig (${{ matrix.next }}) ====="
          cat /tmp/repro.log 2>/dev/null || echo "(no [REPRO] lines)"
          exit $rc

      # The full test-mode harness. This test fails on preview.10 and later.
      - name: "testmode (real app shape)"
        if: always()
        env:
          PORT: "3001"
        run: |
          rm -f /tmp/repro.log
          set +e; pnpm e2e:testmode; rc=$?; set -e
          echo "===== [REPRO] testmode (${{ matrix.next }}) ====="
          cat /tmp/repro.log 2>/dev/null || echo "(no [REPRO] lines)"
          exit $rc
