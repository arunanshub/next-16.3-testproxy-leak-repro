name: repro
on: [push, workflow_dispatch]

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        next: ["16.3.0-preview.9", "16.3.0-preview.10", "16.3.0"]
    name: "next ${{ matrix.next }}"
    env:
      NEXTV: ${{ matrix.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm add next@${{ matrix.next }}

      - name: Result table header
        run: |
          {
            echo "### next ${{ matrix.next }}"
            echo ""
            echo "Cookie length as read three ways (a value of 0 means the cookie was lost):"
            echo ""
            echo "| next | mode | direct .get() | new Headers() | forEach | bug |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check (plain, no testProxy)
        run: bash scripts/check.sh plain

      - name: Check (testProxy on)
        run: bash scripts/check.sh testproxy
