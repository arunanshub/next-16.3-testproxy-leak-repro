name: repro
on: [push, workflow_dispatch]

# TDD-style: each cell ASSERTS the correct behavior (the copy must keep the
# cookie), so a cell goes RED exactly where the bug is. Expect green on
# preview.9 everywhere, and red on preview.10 / 16.3.0 in the testmode cell.
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        next: ["16.3.0-preview.9", "16.3.0-preview.10", "16.3.0"]
    name: "next ${{ matrix.next }}"
    env:
      NEXTV: ${{ matrix.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm add next@${{ matrix.next }}
      - run: pnpm exec playwright install --with-deps chromium

      # No testProxy, no testmode runtime — the production shape. Expected GREEN.
      - name: "plain (production shape)"
        if: always()
        env:
          PORT: "3000"
        run: |
          rm -f /tmp/repro.log
          set +e; pnpm e2e:plain; rc=$?; set -e
          echo "===== [REPRO] plain (${{ matrix.next }}) ====="
          cat /tmp/repro.log 2>/dev/null || echo "(no [REPRO] lines)"
          exit $rc

      # testProxy config ON, but plain runtime. Isolates config from runtime.
      - name: "testProxy config, plain runtime"
        if: always()
        env:
          PORT: "3002"
        run: |
          rm -f /tmp/repro.log
          set +e; pnpm e2e:proxyconfig; rc=$?; set -e
          echo "===== [REPRO] proxyconfig (${{ matrix.next }}) ====="
          cat /tmp/repro.log 2>/dev/null || echo "(no [REPRO] lines)"
          exit $rc

      # Full testmode harness, like the real app. Expected RED on preview.10+.
      - name: "testmode (real app shape)"
        if: always()
        env:
          PORT: "3001"
        run: |
          rm -f /tmp/repro.log
          set +e; pnpm e2e:testmode; rc=$?; set -e
          echo "===== [REPRO] testmode (${{ matrix.next }}) ====="
          cat /tmp/repro.log 2>/dev/null || echo "(no [REPRO] lines)"
          exit $rc
