name: repro
on: [push, workflow_dispatch]

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        next: ["16.3.0-preview.9", "16.3.0-preview.10", "16.3.0"]
    name: "next ${{ matrix.next }}"
    env:
      NEXTV: ${{ matrix.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm add next@${{ matrix.next }}
      - run: pnpm exec playwright install --with-deps chromium

      # Baseline: a plain curl request, no browser, no testmode. Prints the
      # cookie length read three ways. Expected: all equal (no bug at runtime).
      - name: Baseline curl (plain)
        continue-on-error: true
        run: bash scripts/check.sh plain

      # Browser navigation WITHOUT the testmode harness. The server prints
      # [REPRO] lines for every render pass of /probe (prefetch prerender +
      # runtime). A viaConstructor of 0 while direct is non-zero is the bug.
      - name: Browser nav (plain, no testmode)
        continue-on-error: true
        run: pnpm e2e:plain

      # Browser navigation WITH the testmode harness, like the real app.
      - name: Browser nav (testmode)
        continue-on-error: true
        run: pnpm e2e:testmode
