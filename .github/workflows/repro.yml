name: repro
on: [push, workflow_dispatch]

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        next: ["16.3.0-preview.9", "16.3.0-preview.10", "16.3.0"]
    name: "next ${{ matrix.next }}"
    env:
      NEXTV: ${{ matrix.next }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm add next@${{ matrix.next }}
      - run: pnpm exec playwright install --with-deps chromium

      # Browser navigation WITHOUT the testmode harness. /probe writes a [REPRO]
      # line for every render pass (prefetch prerender + runtime). A
      # viaConstructor of 0 while direct is non-zero is the bug. If it appears
      # here, the trigger is the render model (prod runs it too), not testmode.
      - name: Browser nav (plain, no testmode)
        continue-on-error: true
        env:
          PORT: "3000"
        run: |
          rm -f /tmp/repro.log
          pnpm e2e:plain || true
          echo "===== [REPRO] plain (next ${{ matrix.next }}) ====="
          cat /tmp/repro.log || echo "(no [REPRO] lines — /probe did not render)"

      # Browser navigation WITH the testmode harness, like the real app.
      - name: Browser nav (testmode)
        continue-on-error: true
        env:
          PORT: "3001"
        run: |
          rm -f /tmp/repro.log
          pnpm e2e:testmode || true
          echo "===== [REPRO] testmode (next ${{ matrix.next }}) ====="
          cat /tmp/repro.log || echo "(no [REPRO] lines — /probe did not render)"
